# Python environment for the analysis scripts (scripts/plot_log.py).
# With uv:  uv sync    then    uv run scripts/plot_log.py power_log.csv --out chart.png
[project]
name = "gpu-psu-stress-scripts"
version = "0.1.0"
description = "Analysis scripts for gpu-psu-stress CSV logs"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.uv]
# Not an installable package: uv only creates the environment with the dependencies.
package = false
